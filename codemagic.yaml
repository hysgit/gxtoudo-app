workflows:
  gxtodo-android:
    name: 高效Todo Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: 3.50.0
      java: 17
      vars:
        GXTODO_SERVER: https://tudosrv.woslx.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Analyze and run tests
        script: |
          flutter analyze
          flutter test
      - name: Build Android debug APK
        script: |
          flutter build apk --debug \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GXTODO_SERVER="$GXTODO_SERVER"
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  gxtodo-ios-simulator:
    name: 高效Todo iOS Simulator
    max_build_duration: 90
    instance_type: mac_mini_m2
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
      vars:
        GXTODO_SERVER: https://tudosrv.woslx.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Analyze and run tests
        script: |
          flutter analyze
          flutter test
      - name: Compile the iOS Simulator app
        script: |
          flutter build ios --simulator --debug \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GXTODO_SERVER="$GXTODO_SERVER"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            build/ios/高效Todo-iOS-Simulator.zip
    artifacts:
      - build/ios/高效Todo-iOS-Simulator.zip
      - /tmp/xcodebuild_logs/**/*.log
