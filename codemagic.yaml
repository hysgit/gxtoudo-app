workflows:
  gxtodo-android:
    name: 高效Todo Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.50.0
      java: 17
      vars:
        GXTODO_SERVER: https://tudosrv.woslx.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Analyze and run tests
        script: |
          flutter analyze
          flutter test
      - name: Build Android debug APK
        script: |
          flutter build apk --debug \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GXTODO_SERVER="$GXTODO_SERVER"
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  gxtodo-ios-simulator:
    name: 高效Todo iOS Simulator
    max_build_duration: 90
    instance_type: mac_mini_m2
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
      vars:
        GXTODO_SERVER: https://tudosrv.woslx.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Analyze and run tests
        script: |
          flutter analyze
          flutter test
      - name: Compile the iOS Simulator app
        script: |
          flutter build ios --simulator --debug \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GXTODO_SERVER="$GXTODO_SERVER"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            build/ios/高效Todo-iOS-Simulator.zip
    artifacts:
      - build/ios/高效Todo-iOS-Simulator.zip
      - /tmp/xcodebuild_logs/**/*.log

  gxtodo-ios-testflight:
    name: 高效Todo iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tudo
    environment:
      flutter: 3.50.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.icycloud.fdtodolist
      vars:
        GXTODO_SERVER: https://tudosrv.woslx.com
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Analyze and run tests
        script: |
          flutter analyze
          flutter test
      - name: Set up App Store code signing
        script: xcode-project use-profiles
      - name: Build App Store IPA
        script: |
          python3 ios/check_push_profile.py "$HOME/export_options.plist" net.icycloud.fdtodolist
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=GXTODO_SERVER="$GXTODO_SERVER" \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        beta_groups:
          - 高效Todo 内测
