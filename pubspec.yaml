name: gxtodo
description: 高效Todo Android 与 iOS 客户端
publish_to: none
version: 7.4.2+118

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  http: ^1.5.0
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  record: ^6.1.2
  just_audio: ^0.10.5
  speech_to_text: ^7.3.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
