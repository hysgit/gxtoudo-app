name: gxtodo
description: 高效Todo Android 与 iOS 客户端
publish_to: none
version: 7.2.1+113

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  http: ^1.5.0
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
